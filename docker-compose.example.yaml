# Polish Piper: a service to paste into your own docker-compose.yaml.
# Repository cloned next to it: git clone https://github.com/witold-gren/home-assistant-polish-piper
services:
  piper:
    build: ./home-assistant-polish-piper
    image: local/polish-piper:2.5.2
    container_name: piper
    restart: unless-stopped
    ports:
      - "10200:10200"            # Wyoming - address for Home Assistant
      - "10205:5000"             # optional: web panel for voices
    volumes:
      - ./piper/models:/data     # voices: *.onnx + *.onnx.json
      - /etc/localtime:/etc/localtime:ro
    # Arguments as in rhasspy/wyoming-piper (the image adds --uri and --data-dir itself)
    command:
      - --voice=pl_PL-gosia-medium       # or your own voice from ./piper/models
      - --length-scale=1.0               # speed (larger = slower)
      - --sentence-silence=0.25          # pause between sentences (s)
      - --update-voices                  # refresh the voice list on start
      # The voice panel has no login - expose it only on your home network:
      # - --web-server
      # - --web-server-host=0.0.0.0
      # - --web-server-allow=192.168.1.0/24
    # environment:
    #   PL_TTS_NORMALIZE: "0"            # turns normalization off without rebuilding
